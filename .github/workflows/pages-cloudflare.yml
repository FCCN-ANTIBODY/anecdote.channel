# Deploys this repository to Cloudflare Pages on every push to main.
#
# Same shape as the other Pages projects here (DiscoveryWritten/discoverywritten.com deploy.yml):
# wrangler-action, apiToken + accountId from secrets, project name from a variable. The only
# differences are forced by this site rather than chosen:
#
#   * it deploys `.`, not `docs/` — the repository IS the site, served exactly as committed,
#     with no build output directory;
#   * it runs one build step first, because sites.json is generated and gitignored (see below).
#
# Needs three values, all settable from the GitHub UI:
#   secrets.CLOUDFLARE_PAGES_TOKEN  — Account → Cloudflare Pages → Edit. An ORG secret: publishing
#                                     is what every site in the account does, and these tokens
#                                     cannot be scoped to one project, so scoping them by NAME to
#                                     one job is the only scoping available.
#   secrets.CLOUDFLARE_ACCOUNT_ID   — dash → account home, right-hand sidebar.
#   vars.CLOUDFLARE_PAGES_PROJECT   — the Pages project's name.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # THE ONE GENERATED FILE. scripts/sync-sites.mjs writes sites.json, which is gitignored and
      # which index.html fetches at runtime — without it the front page renders the standing-by
      # fallback with an empty directory, silently (docs/hosting.md, and scripts/page.test.mjs
      # exists because that already happened once). It also FAILS when a host in config/sites.txt
      # has no TLS coverage in config/san-list.txt, which is the guard that stops a name being
      # published before its certificate exists — keep that fatal.
      #
      # Expected to move to Atlas, whose office is the directory (civic-node OPEN-QUESTIONS §U).
      # When it does, this step and its token go and this becomes a plain upload.
      - name: Build the directory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-sites.mjs

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
