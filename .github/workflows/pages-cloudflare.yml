# Publish to Cloudflare Pages.
#
# This is the ONLY thing in this repository that talks to Cloudflare about content. The workflow it
# replaces deployed to GitHub Pages and merely PURGED Cloudflare's cache — Cloudflare was a cache in
# front of another origin, never the origin. Now it is the origin.
#
# Direct upload rather than Cloudflare's Git integration, on purpose: a deploy you can watch, whose
# failures land in the same place as every other failure here, and whose configuration is in the
# repository rather than in a dashboard nobody can diff.
name: "Publish · Cloudflare Pages"

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # THE ONE GENERATED FILE. scripts/sync-sites.mjs writes sites.json, which is gitignored and
      # which index.html fetches at runtime — without it the front page renders the standing-by
      # fallback with an empty directory, silently (docs/hosting.md). It also FAILS when a host in
      # config/sites.txt has no TLS coverage in config/san-list.txt, and that failure is the guard
      # that stops a name being published before its certificate exists. Do not make it non-fatal.
      #
      # This step is expected to move to Atlas, whose office is the directory. When it does, this
      # job loses its build step and its token and becomes a plain upload.
      - name: Build the directory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-sites.mjs

      # Say what is missing rather than failing obscurely three lines later. Twice today a missing
      # credential presented as something else entirely.
      - name: Check credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="secret CLOUDFLARE_PAGES_TOKEN (needs Account → Cloudflare Pages: Edit — NOT the same token as CLOUDFLARE_API_TOKEN, which holds SSL permissions for acm-sync)"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="${missing:+$missing; also }CLOUDFLARE_ACCOUNT_ID (a Variable or Secret; Cloudflare dashboard → Workers & Pages → Account ID)"
          if [ -n "$missing" ]; then
            echo "::error title=Cannot deploy::Not set: $missing"
            exit 1
          fi
          echo "credentials present"

      # `.` is the whole site: this repo is served as committed, with no build output directory.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy . --project-name=anecdote --branch=main --commit-dirty=true
