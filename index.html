<!doctype html>
<!-- Public holding page for anecdote.channel. The preflight demos (crunch / bench / composer) are
     no longer linked here — they were pulled down from the public surface and repurposed as build
     DIAGNOSTICS: still served as files, still reachable by direct path, but visited on purpose
     (by you, by CI, by the headless verifier) rather than offered to a visitor.

     Append ?diag to this URL to run them: each demo loads in a hidden, offscreen iframe (the
     iframe[id] rule below parks them at -100vw) and the <code> readout becomes a pass/fail rollup
     of whether the instrument cold-loads in each surface. Otherwise the public sees only the
     big centered heading. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>anecdote.channel</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/assets/ds/colors.css">
<link rel="stylesheet" href="/assets/ds/spacing.css">
<link rel="stylesheet" href="/assets/ds/typography.css">
<link rel="stylesheet" href="/assets/ds/fonts.css">
<!-- Hold the app shell so anecdote boots with no connection / origin unreachable (sw.js, docs/origin.md). -->
<script>if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("/sw.js",{type:"module"}).then(function(){return navigator.serviceWorker.ready;}).then(function(){if(navigator.serviceWorker.controller)navigator.serviceWorker.controller.postMessage({type:"firmware-check"});}).catch(function(){});});</script>
<style>
  /* The page's own use of the design system. Tokens come from /assets/ds/ — never redefined here.
     Two voices, no third (typography.css): Playfair says the loud thing, Space Mono says the small
     true thing underneath it. So a DESTINATION is set in serif — it is the name you would say out
     loud — and everything structural (the levels, the notes) is mono. */
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--paper); }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--text-body);
    font-family: var(--font-mono);
    font-size: var(--mono-body);
    line-height: var(--leading-body);
  }

  /* ---- the masthead: the one loud thing on a page that holds almost nothing ---------- */
  .masthead {
    padding: var(--space-8) var(--gutter) var(--space-5);
    border-bottom: var(--rule) solid var(--border);
  }
  .wordmark {
    margin: 0;
    font-family: var(--font-display);
    font-weight: var(--weight-display);
    font-size: var(--display-hero);
    line-height: var(--leading-tight);
    letter-spacing: var(--tracking-display);
    color: var(--text-strong);
    text-shadow: var(--shadow-display);
  }
  /* The apex is the name people say out loud; the full host is the small true thing under it. */
  .eyebrow {
    margin: var(--space-4) 0 0;
    font-size: var(--text-eyebrow);
    letter-spacing: var(--tracking-caps);
    text-transform: uppercase;
    color: var(--text-muted);
  }

  /* ---- the directory ----------------------------------------------------------------- */
  #directory { padding: var(--space-7) var(--gutter) var(--space-9); max-width: var(--measure); }
  #directory[hidden] { display: none; }
  #directory ul { list-style: none; margin: 0; padding: 0; }
  #directory > ul > li + li { margin-top: var(--space-7); }
  #directory ul ul { margin-top: var(--space-3); }
  #directory ul ul li + li { border-top: 1px solid var(--border-faint); }

  /* A level nobody serves is a category, not a destination: mono, small, set as an eyebrow. */
  .category {
    display: block;
    font-size: var(--text-eyebrow);
    letter-spacing: var(--tracking-caps);
    text-transform: uppercase;
    color: var(--text-muted);
  }
  /* A destination carries the serif — it is a place, and it is meant to be read as one. */
  .place, .soon {
    display: block;
    font-family: var(--font-display);
    font-size: var(--display-3);
    line-height: var(--leading-snug);
    padding: var(--space-3) 0;
  }
  a.place { color: var(--text-strong); text-decoration: none; }
  a.place:hover { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: var(--rule); }
  a.place:focus-visible { outline: var(--rule) solid var(--border); outline-offset: 4px; }
  /* Listed but not answering: shown, deliberately not a link. */
  .soon { color: var(--text-muted); }
  .soon small {
    font-family: var(--font-mono);
    font-size: var(--mono-caption);
    letter-spacing: var(--tracking-caps);
    text-transform: uppercase;
    margin-left: var(--space-3);
    vertical-align: middle;
  }

  /* ---- the standing-by fallback + ?diag readout -------------------------------------- */
  #heading {
    display: block;
    padding: var(--space-7) var(--gutter);
    font-family: var(--font-mono);
    font-size: var(--mono-small);
    color: var(--text-muted);
    white-space: pre;
  }
  #heading[hidden] { display: none; }

  /* Diagnostics run offscreen (see the ?diag block below). */
  iframe[id] { position: fixed; left: -100vw; width: 100vw; height: 100vh; border: 0; }
</style>
</head>
<body>
<header class="masthead">
  <h1 class="wordmark">anecdote</h1>
  <p class="eyebrow" id="eyebrow">Please Stand By.</p>
</header>
<nav id="directory" hidden></nav>
<code id="heading" hidden></code>

<script type="module">
  // THE DIRECTORY. This same page is the listing at EVERY level: it reads its own
  // location.hostname and renders what sits beneath it, so `north.colorado.anecdote.channel`
  // becomes a listing of its leaves the moment a host is arranged for it — no new page.
  // Levels nobody serves still render, as categories. Offline-safe: sites.json rides in the
  // shell (sw.js), and a failed fetch simply leaves the standing-by heading alone.
  import { APEX, treeUnder } from "/directory.mjs";

  (async () => {
    const here = location.hostname.endsWith(APEX) ? location.hostname : APEX;
    let data;
    try {
      const res = await fetch("/sites.json", { cache: "no-cache" });
      if (!res.ok) return;
      data = await res.json();
    } catch { return; }                       // origin unreachable — stand by, as before

    // System hosts are machinery other software talks to, not somewhere to send a person.
    // A destination that is not answering yet still lists, unlinked — "soon" is honest.
    const published = (data.sites || []).filter((s) => !s.draft && !s.system);
    // At the apex, list from the configured root: the memorable name should show destinations,
    // not the top of the tree. Deeper in, a level always lists beneath itself.
    const from = (here === (data.apex || APEX) && data.root) ? data.root : here;
    const tree = treeUnder(from, published);
    if (!tree.length) return;                 // nothing beneath this level yet

    const list = (nodes) => {
      const ul = document.createElement("ul");
      for (const n of nodes) {
        const li = document.createElement("li");
        const seg = n.host.split(".")[0];
        const name = n.site?.label || seg;
        if (n.site && n.site.served) {         // answering: a place you can go
          const a = document.createElement("a");
          a.className = "place";
          a.href = `https://${n.host}/`;
          a.textContent = name;
          li.append(a);
        } else if (n.site) {                   // listed, not answering yet — say so, do not link
          const span = document.createElement("span");
          span.className = "soon";
          span.textContent = name;
          li.append(span, Object.assign(document.createElement("small"), { textContent: "soon" }));
        } else {                               // a level nobody serves — a category
          const span = document.createElement("span");
          span.className = "category";
          span.textContent = seg;
          li.append(span);
        }
        if (n.children.length) li.append(list(n.children));
        ul.append(li);
      }
      return ul;
    };

    const nav = document.getElementById("directory");
    nav.append(list(tree));
    nav.hidden = false;
    // The wordmark is the name you say out loud; the host is the small true thing under it.
    document.getElementById("eyebrow").textContent = here;
  })();
</script>

<script type="module">
  // Public default: nothing runs, nothing loads. The heading stands by.
  // ?diag runs the pulled-down demos as build diagnostics in hidden offscreen iframes
  // (the iframe[id] rule parks them offscreen) and rolls their cold-load up into the readout.
  if (new URLSearchParams(location.search).has("diag")) {
    const DIAGS = [
      { id: "diag-crunch",   src: "composer/crunch.html?real=1", name: "crunch" },
      { id: "diag-bench",    src: "composer/bench.html",         name: "bench" },
      { id: "diag-composer", src: "composer/index.html",         name: "composer" },
    ];
    const heading = document.getElementById("heading");
    heading.hidden = false;
    const state = Object.fromEntries(DIAGS.map((d) => [d.name, "…"]));
    const render = () => {
      heading.textContent =
        "build diagnostics\n" +
        DIAGS.map((d) => `  ${state[d.name].padEnd(4)} ${d.name}`).join("\n");
    };
    render();
    for (const d of DIAGS) {
      const f = document.createElement("iframe");
      f.id = d.id;                     // the id is what the CSS hides offscreen
      f.title = d.name;
      const done = (mark) => { if (state[d.name] === "…") { state[d.name] = mark; render(); } };
      f.addEventListener("load", () => done("ok"));
      f.addEventListener("error", () => done("err"));
      setTimeout(() => done("slow"), 30000);   // didn't finish cold-loading in time
      f.src = d.src;
      document.body.appendChild(f);
    }
  }
</script>
</body>
</html>
