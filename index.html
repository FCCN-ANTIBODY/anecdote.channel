<!doctype html>
<!-- Public holding page for anecdote.channel. The preflight demos (crunch / bench / composer) are
     no longer linked here — they were pulled down from the public surface and repurposed as build
     DIAGNOSTICS: still served as files, still reachable by direct path, but visited on purpose
     (by you, by CI, by the headless verifier) rather than offered to a visitor.

     Append ?diag to this URL to run them: each demo loads in a hidden, offscreen iframe (the
     iframe[id] rule below parks them at -100vw) and the <code> readout becomes a pass/fail rollup
     of whether the instrument cold-loads in each surface. Otherwise the public sees only the
     big centered heading. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>anecdote.channel</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#990049">
<link rel="icon" href="/icon.svg">
<!-- Hold the app shell so anecdote boots with no connection / origin unreachable (sw.js, docs/origin.md). -->
<script>if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("/sw.js",{type:"module"}).then(function(){return navigator.serviceWorker.ready;}).then(function(){if(navigator.serviceWorker.controller)navigator.serviceWorker.controller.postMessage({type:"firmware-check"});}).catch(function(){});});</script>
<style>
  :root {
    --io: #ccad31;
    --accent: #990049;
    --accent-fg: #e9d8f7;
    --accent-sh: #000000a0;
    --bg1: #293033;
    --bg2: #274f4b;
    --fg1: #dfdfdf;
    --fg2: #e9daf5;
    --fg-inverse: #040404;
    --sh: #18151a;
    --stroke: #282524;
    --shade-hard: #232224f2;
    --shade: #23222440;
    --border: #00000080;
  }
  /* The directory: quiet, nested by hostname depth. Categories are levels nobody serves yet. */
  #directory { font: 14px/1.7 ui-monospace, Menlo, monospace; margin: 1.5rem auto 3rem; max-width: 46rem; padding: 0 1.5rem; }
  #directory ul { list-style: none; margin: 0; padding-left: 1.25rem; }
  #directory > ul { padding-left: 0; }
  #directory li { margin: .2rem 0; }
  #directory a { color: var(--fg2); text-decoration: none; border-bottom: 1px solid var(--accent); }
  #directory a:hover, #directory a:focus { color: var(--accent-fg); background: var(--shade); }
  #directory .category { color: var(--fg1); opacity: .55; }
  #directory .soon { color: var(--fg1); opacity: .75; }
  #directory small { color: var(--fg1); opacity: .5; margin-left: .6rem; }
  #directory[hidden] { display: none; }
  html { width: 100vw; min-height: 100vh; place-content: center; }
  html::before {
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(ellipse 100% 100% at 50% bottom, var(--bg2) 0%, var(--bg1) 80%, var(--bg1) 100%), var(--bg1);
    will-change: transform; transform: translateZ(0); contain: paint; image-rendering:auto; backface-visibility:hidden;
  }
  body { display: flex; flex-direction: column; width: max-content; padding: 1rem; margin: auto; color: var(--fg2); }
  code { white-space: pre; font-weight: bolder; font-size: 1.5em; font-family: "Courier New", Courier, monospace; color: var(--fg2); mix-blend-mode: overlay; text-shadow: 0 .15rem 0 var(--sh); }
  body::before { content: ""; position: fixed; inset: 3rem; background-color: var(--shade); box-shadow: 0 0 .5rem var(--border); z-index: -1; pointer-events: none; }
  iframe[id] { position: absolute; width: 1px; height: 1px; left: -100vw; top: -100vh; pointer-events: none; opacity: 0; user-select: none; overflow: hidden; border: none; margin: 0; padding: 0; }
</style>
</head>
<body>
<code id="heading">Please Stand By.</code>
<nav id="directory" hidden></nav>

<script type="module">
  // THE DIRECTORY. This same page is the listing at EVERY level: it reads its own
  // location.hostname and renders what sits beneath it, so `north.colorado.anecdote.channel`
  // becomes a listing of its leaves the moment a host is arranged for it — no new page.
  // Levels nobody serves still render, as categories. Offline-safe: sites.json rides in the
  // shell (sw.js), and a failed fetch simply leaves the standing-by heading alone.
  import { APEX, treeUnder } from "/directory.mjs";

  (async () => {
    const here = location.hostname.endsWith(APEX) ? location.hostname : APEX;
    let data;
    try {
      const res = await fetch("/sites.json", { cache: "no-cache" });
      if (!res.ok) return;
      data = await res.json();
    } catch { return; }                       // origin unreachable — stand by, as before

    // System hosts are machinery other software talks to, not somewhere to send a person.
    // A destination that is not answering yet still lists, unlinked — "soon" is honest.
    const published = (data.sites || []).filter((s) => !s.draft && !s.system);
    // At the apex, list from the configured root: the memorable name should show destinations,
    // not the top of the tree. Deeper in, a level always lists beneath itself.
    const from = (here === (data.apex || APEX) && data.root) ? data.root : here;
    const tree = treeUnder(from, published);
    if (!tree.length) return;                 // nothing beneath this level yet

    const list = (nodes) => {
      const ul = document.createElement("ul");
      for (const n of nodes) {
        const li = document.createElement("li");
        const seg = n.host.split(".")[0];
        const name = n.site?.label || seg;
        if (n.site && n.site.served) {         // answering: a place you can go
          const a = document.createElement("a");
          a.href = `https://${n.host}/`;
          a.textContent = name;
          li.append(a);
        } else if (n.site) {                   // listed, not answering yet — say so, do not link
          const span = document.createElement("span");
          span.className = "soon";
          span.textContent = name;
          li.append(span, Object.assign(document.createElement("small"), { textContent: "soon" }));
        } else {                               // a level nobody serves — a category
          const span = document.createElement("span");
          span.className = "category";
          span.textContent = seg;
          li.append(span);
        }
        if (n.children.length) li.append(list(n.children));
        ul.append(li);
      }
      return ul;
    };

    const nav = document.getElementById("directory");
    nav.append(list(tree));
    nav.hidden = false;
    document.getElementById("heading").textContent = here;
  })();
</script>

<script type="module">
  // Public default: nothing runs, nothing loads. The heading stands by.
  // ?diag runs the pulled-down demos as build diagnostics in hidden offscreen iframes
  // (the iframe[id] rule parks them offscreen) and rolls their cold-load up into the readout.
  if (new URLSearchParams(location.search).has("diag")) {
    const DIAGS = [
      { id: "diag-crunch",   src: "composer/crunch.html?real=1", name: "crunch" },
      { id: "diag-bench",    src: "composer/bench.html",         name: "bench" },
      { id: "diag-composer", src: "composer/index.html",         name: "composer" },
    ];
    const heading = document.getElementById("heading");
    const state = Object.fromEntries(DIAGS.map((d) => [d.name, "…"]));
    const render = () => {
      heading.textContent =
        "build diagnostics\n" +
        DIAGS.map((d) => `  ${state[d.name].padEnd(4)} ${d.name}`).join("\n");
    };
    render();
    for (const d of DIAGS) {
      const f = document.createElement("iframe");
      f.id = d.id;                     // the id is what the CSS hides offscreen
      f.title = d.name;
      const done = (mark) => { if (state[d.name] === "…") { state[d.name] = mark; render(); } };
      f.addEventListener("load", () => done("ok"));
      f.addEventListener("error", () => done("err"));
      setTimeout(() => done("slow"), 30000);   // didn't finish cold-loading in time
      f.src = d.src;
      document.body.appendChild(f);
    }
  }
</script>
</body>
</html>
