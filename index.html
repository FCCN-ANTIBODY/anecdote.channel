<!doctype html>
<!-- Public holding page for anecdote.channel. The preflight demos (crunch / bench / composer) are
     no longer linked here — they were pulled down from the public surface and repurposed as build
     DIAGNOSTICS: still served as files, still reachable by direct path, but visited on purpose
     (by you, by CI, by the headless verifier) rather than offered to a visitor.

     Append ?diag to this URL to run them: each demo loads in a hidden, offscreen iframe (the
     iframe[id] rule below parks them at -100vw) and the <code> readout becomes a pass/fail rollup
     of whether the instrument cold-loads in each surface. Otherwise the public sees only the
     big centered heading. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>anecdote.channel</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/assets/ds/colors.css">
<link rel="stylesheet" href="/assets/ds/spacing.css">
<link rel="stylesheet" href="/assets/ds/typography.css">
<link rel="stylesheet" href="/assets/ds/fonts.css">
<!-- Hold the app shell so anecdote boots with no connection / origin unreachable (sw.js, docs/origin.md). -->
<script>if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("/sw.js",{type:"module"}).then(function(){return navigator.serviceWorker.ready;}).then(function(){if(navigator.serviceWorker.controller)navigator.serviceWorker.controller.postMessage({type:"firmware-check"});}).catch(function(){});});</script>
<style>
  /* The page's own use of the design system. Tokens come from /assets/ds/ — never redefined here.
     Two voices, no third (typography.css): Playfair says the loud thing, Space Mono says the small
     true thing underneath it. So a DESTINATION is set in serif — it is the name you would say out
     loud — and everything structural (the levels, the notes) is mono. */
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--paper); }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--text-body);
    font-family: var(--font-mono);
    font-size: var(--mono-body);
    line-height: var(--leading-body);
  }

  /* ---- the masthead: the one loud thing on a page that holds almost nothing ---------- */
  .masthead {
    padding: var(--space-8) var(--gutter) var(--space-5);
    border-bottom: var(--rule) solid var(--border);
  }
  .wordmark {
    margin: 0;
    font-family: var(--font-display);
    font-weight: var(--weight-display);
    font-size: var(--display-hero);
    line-height: var(--leading-tight);
    letter-spacing: var(--tracking-display);
    color: var(--text-strong);
    text-shadow: var(--shadow-display);
  }
  /* The apex is the name people say out loud; the full host is the small true thing under it. */
  .eyebrow {
    margin: var(--space-4) 0 0;
    font-size: var(--text-eyebrow);
    letter-spacing: var(--tracking-caps);
    text-transform: uppercase;
    color: var(--text-muted);
  }

  /* ---- the directory ----------------------------------------------------------------- */
  /* A place heading flush left; categories in a fixed left column that never moves; the names
     they hold in the column beside it. One name reads as a row across, several stack on the
     right while the category stays put. */
  /* The content keeps the full gutter. Headers reach OUT of it to the left; nothing pushes the
     names inward, because column width is the one thing here worth spending. */
  #directory { padding: var(--space-7) var(--gutter) var(--space-9); max-width: var(--measure); }
  #directory[hidden] { display: none; }

  /* A city is a divider and a quiet label, not a headline. It was set in the display serif at
     the same size as the site names, so it read as another clickable thing — and there is nothing
     to click: we do not serve a directory per city yet. Mono, and it stops pretending. */
  .place-block + .place-block {
    margin-top: var(--space-7);
    border-top: 1px solid var(--border-faint);
    padding-top: var(--space-7);
  }
  .place-name {
    margin: 0 0 var(--space-5);
    /* Out of the gutter entirely — hugging the page, not the column. */
    margin-left: calc(var(--gutter) * -1);
    font-family: var(--font-mono);
    font-weight: var(--weight-mono-bold);
    font-size: var(--mono-lead);
    letter-spacing: var(--tracking-caps);
    text-transform: uppercase;
    color: var(--text-strong);
  }
  /* A solid rule hanging left of the label. The longer the bar, the higher the header — the
     hierarchy is a length you can see at a glance rather than a font size you have to compare. */
  /* THE TAB IS THE INDENT. Its width is how far the text starts from the left, so the smaller a
     header is the longer its tab and the further in it sits. The place is the outermost thing on
     the page: a 4px nub against the very edge, text immediately right of it. */
  .place-name::before {
    content: "";
    display: inline-block;
    width: 4px;                 /* the width is the whole message */
    height: 1em;                /* as tall as the text, both ranks the same */
    margin-right: .5rem;
    background: var(--ink);
    vertical-align: text-bottom;
  }

  .rows {
    display: grid;
    grid-template-columns: minmax(7rem, max-content) 1fr;
    column-gap: var(--space-6);
    row-gap: var(--space-4);
    align-items: baseline;
  }
  /* The category. Mono, small-caps, and the same left edge on every row in the block. */
  .cat {
    font-family: var(--font-mono);
    font-size: var(--text-eyebrow);
    letter-spacing: var(--tracking-caps);
    text-transform: uppercase;
    color: var(--text-muted);
    padding-top: .35em;              /* optical: sit the caps on the serif's baseline */
  }
  /* One rank in, so a LONGER tab. Its text lands half a character left of the names below it —
     enough to read as a header, not enough to open a second column. */
  .cat::before {
    content: "";
    display: inline-block;
    width: 1.4rem;              /* longer, because it is further in */
    height: 1em;                /* identical height — same object, different width */
    margin-left: calc((1.4rem + .5rem + .5ch) * -1);
    margin-right: .5rem;
    background: var(--ink);
    vertical-align: text-bottom;
  }
  .items { display: flex; flex-direction: column; gap: var(--space-4); }
  .item { display: block; }

  .place, .soon {
    font-family: var(--font-display);
    font-size: var(--display-3);
    line-height: var(--leading-snug);
  }
  a.place { color: var(--text-strong); text-decoration: none; }
  a.place:hover { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: var(--rule); }
  a.place:focus-visible { outline: var(--rule) solid var(--border); outline-offset: 4px; }
  .soon { color: var(--text-muted); }

  .note, .out, .also {
    display: block;
    font-family: var(--font-mono);
    font-size: var(--mono-caption);
    color: var(--text-muted);
    margin-top: var(--space-1);
  }
  .note, .also { letter-spacing: var(--tracking-caps); text-transform: uppercase; }
  .also { color: var(--ink-faint); }

  @media (max-width: 34rem) {
    /* Too narrow for two columns: the category becomes a heading over its names, which keeps
       the same reading order rather than inventing a second layout. */
    .rows { grid-template-columns: 1fr; row-gap: var(--space-2); }
    .cat { padding-top: var(--space-3); }
    .items { margin-bottom: var(--space-3); }
  }

  /* ---- the standing-by fallback + ?diag readout -------------------------------------- */
  #heading {
    display: block;
    padding: var(--space-7) var(--gutter);
    font-family: var(--font-mono);
    font-size: var(--mono-small);
    color: var(--text-muted);
    white-space: pre;
  }
  #heading[hidden] { display: none; }

  /* Diagnostics run offscreen (see the ?diag block below). */
  iframe[id] { position: fixed; left: -100vw; width: 100vw; height: 100vh; border: 0; }
</style>
</head>
<body>
<header class="masthead">
  <h1 class="wordmark">anecdote</h1>
  <p class="eyebrow" id="eyebrow">Please Stand By.</p>
</header>
<nav id="directory"></nav>

<!-- THE LISTING, AS HTML FRAGMENTS. Not a Liquid loop and not a build product: these are ordinary
     <template> elements, the browser's own template syntax, cloned once per row at runtime.

     The point of this whole apparatus is that you can publish shitty source files and get a
     website with no build. So this page IS the source. It is served exactly as committed, and it
     interprets itself when it loads. Liquid's job here is includes — which is how an iframe gets
     composed — and iteration is HTML's job, because HTML already has a way to say "this shape,
     repeated". -->
<template id="t-place">
  <section class="place-block">
    <h2 class="place-name"></h2>
    <p class="reserved" hidden>reserved — nothing here yet</p>
    <div class="rows"></div>
  </section>
</template>
<template id="t-row">
  <div class="cat"></div>
  <div class="items"></div>
</template>
<template id="t-entry">
  <div class="item">
    <a class="place" hidden></a>
    <span class="soon" hidden></span>
    <small class="note" hidden>soon</small>
    <small class="also" hidden></small>
    <small class="out" hidden></small>
  </div>
</template>
<code id="heading" hidden></code>

<script type="module">
  // BIND TO THE PAGE AND INTERPRET IT. That is the whole job. This file is served exactly as it
  // was committed — no build ran, nothing was pre-rendered, and there is no artifact anywhere.
  // Publishing here means committing a source file.
  //
  // Iteration is HTML's: <template> cloned per row. The data is data. Nothing here reimplements a
  // templating language to do what the browser already does.
  const nav = document.getElementById("directory");
  const eyebrow = document.getElementById("eyebrow");
  eyebrow.textContent =
    location.hostname.endsWith("anecdote.channel") ? location.hostname : "anecdote.channel";

  const frag = (id) => document.getElementById(id).content.cloneNode(true);
  const show = (el, text) => { el.hidden = false; if (text != null) el.textContent = text; };

  try {
    const res = await fetch("/sites.json", { cache: "no-cache" });
    if (!res.ok) throw new Error();
    const { listing = [] } = await res.json();

    for (const place of listing) {
      const p = frag("t-place");
      p.querySelector(".place-name").textContent = place.name;
      const rows = p.querySelector(".rows");
      if (!place.rows.length) show(p.querySelector(".reserved"));

      for (const row of place.rows) {
        const r = frag("t-row");
        r.querySelector(".cat").textContent = row.category;
        const items = r.querySelector(".items");
        for (const e of row.entries) {
          const it = frag("t-entry");
          if (e.linked) {
            const a = it.querySelector(".place");
            a.href = e.href;
            if (e.leaves) a.rel = "noopener";
            show(a, e.name);
          } else {
            show(it.querySelector(".soon"), e.name);
            show(it.querySelector(".note"));
          }
          if (e.also) show(it.querySelector(".also"), e.also);
          if (e.leaves) show(it.querySelector(".out"), e.dest + (e.shielded ? "  shielded" : ""));
          items.append(it);
        }
        rows.append(r);
      }
      nav.append(p);
    }
  } catch {
    // Origin unreachable, or no data. The masthead stands by — a page that says less rather than
    // a page that lies.
    eyebrow.textContent = "Please Stand By.";
  }
</script>

<script type="module">
  // Public default: nothing runs, nothing loads. The heading stands by.
  // ?diag runs the pulled-down demos as build diagnostics in hidden offscreen iframes
  // (the iframe[id] rule parks them offscreen) and rolls their cold-load up into the readout.
  if (new URLSearchParams(location.search).has("diag")) {
    const DIAGS = [
      { id: "diag-crunch",   src: "composer/crunch.html?real=1", name: "crunch" },
      { id: "diag-bench",    src: "composer/bench.html",         name: "bench" },
      { id: "diag-composer", src: "composer/index.html",         name: "composer" },
    ];
    const heading = document.getElementById("heading");
    heading.hidden = false;
    const state = Object.fromEntries(DIAGS.map((d) => [d.name, "…"]));
    const render = () => {
      heading.textContent =
        "build diagnostics\n" +
        DIAGS.map((d) => `  ${state[d.name].padEnd(4)} ${d.name}`).join("\n");
    };
    render();
    for (const d of DIAGS) {
      const f = document.createElement("iframe");
      f.id = d.id;                     // the id is what the CSS hides offscreen
      f.title = d.name;
      const done = (mark) => { if (state[d.name] === "…") { state[d.name] = mark; render(); } };
      f.addEventListener("load", () => done("ok"));
      f.addEventListener("error", () => done("err"));
      setTimeout(() => done("slow"), 30000);   // didn't finish cold-loading in time
      f.src = d.src;
      document.body.appendChild(f);
    }
  }
</script>
</body>
</html>
